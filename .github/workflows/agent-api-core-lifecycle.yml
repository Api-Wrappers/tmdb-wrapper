name: Agent API Core Lifecycle

on:
  push:
    branches:
      - agent/api-core-1.1-lifecycle

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/api-core-1.1-lifecycle

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and update lockfile
        run: bun install

      - name: Format
        run: bun run check:write

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Remove temporary workflow
        run: rm .github/workflows/agent-api-core-lifecycle.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/index.ts tests/lifecycle.test.ts docs/index.md docs/client-lifecycle.md .changeset/tidy-rivers-lifecycle.md .github/workflows/agent-api-core-lifecycle.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize api-core lifecycle update"
          git push
