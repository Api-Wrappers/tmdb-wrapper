name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation and package checks without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install supported npm for trusted publishing
        run: npm install --global npm@11.18.0

      - name: Verify npm trusted publishing requirements
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error('npm trusted publishing requires Node 22.14.0 or newer')"
          npm --version | node -e "let v=''; process.stdin.on('data', d => v += d); process.stdin.on('end', () => { const [major, minor, patch] = v.trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm trusted publishing requires npm 11.5.1 or newer'); })"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: bun run verify

      - name: Stop manual publishing outside main
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && github.ref != 'refs/heads/main'
        run: |
          echo "Publishing is only allowed from main." >&2
          exit 1

      - name: Verify npm package contents
        run: npm pack --dry-run --json

      - name: Detect pending changesets
        id: changesets
        shell: bash
        run: |
          shopt -s nullglob
          pending=false
          for file in .changeset/*.md; do
            if [[ "$(basename "$file")" != "README.md" ]]; then
              pending=true
              break
            fi
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Create or update version PR
        if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.changesets.outputs.pending == 'true'
        uses: changesets/action@v1
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package and create release
        id: publish
        if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.changesets.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_ISSUE: "23"
        shell: bash
        run: |
          set -uo pipefail

          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          report=$(mktemp)

          {
            echo "## Release run for \`${package_name}@${version}\`"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$report"

          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "- npm: already published" >> "$report"
          else
            set +e
            npm publish --access public --provenance 2>&1 | tee /tmp/npm-publish.log
            publish_status=${PIPESTATUS[0]}
            set -e

            if [[ $publish_status -ne 0 ]]; then
              {
                echo "- npm: failed"
                echo
                echo '```text'
                tail -n 80 /tmp/npm-publish.log
                echo '```'
              } >> "$report"
              gh issue comment "$STATUS_ISSUE" --body-file "$report" || true
              exit "$publish_status"
            fi

            echo "- npm: published successfully" >> "$report"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "- GitHub release: already exists" >> "$report"
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/${tag}"
            fi

            set +e
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes 2>&1 | tee /tmp/github-release.log
            release_status=${PIPESTATUS[0]}
            set -e

            if [[ $release_status -ne 0 ]]; then
              {
                echo "- GitHub release: failed"
                echo
                echo '```text'
                tail -n 80 /tmp/github-release.log
                echo '```'
              } >> "$report"
              gh issue comment "$STATUS_ISSUE" --body-file "$report" || true
              exit "$release_status"
            fi

            echo "- GitHub release: created successfully" >> "$report"
          fi

          gh issue comment "$STATUS_ISSUE" --body-file "$report"

      - name: Report a pre-publication failure
        if: failure() && github.ref == 'refs/heads/main' && steps.publish.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 23 --body "Release run failed before publication. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
