name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Client tests
        run: bun test tests/client.test.ts

      - name: Lifecycle tests
        run: bun test tests/lifecycle.test.ts

      - name: TMDB client tests
        run: bun test tests/tmdb-client.test.ts

      - name: Endpoint coverage tests
        run: bun test tests/endpoint-coverage.test.ts

      - name: Package build tests
        run: bun test tests/package-build.test.ts

      - name: Verify package contents
        run: bun pm pack --dry-run

      - name: Smoke test packed package
        run: bun run smoke:package
