name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-lock-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update Bun lockfile
        run: bun install

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Update Bun lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify package
        run: bun run verify
